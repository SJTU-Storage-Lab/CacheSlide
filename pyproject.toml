[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cacheslide-sglang"
version = "0.4.0"
description = "Shared CacheSlide algorithms with an audited native SGLang adapter"
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
dependencies = ["torch>=2.9", "safetensors>=0.5"]

[project.optional-dependencies]
engine = ["sglang==0.5.19"]
vllm = ["vllm==0.29.0"]
test = ["pytest>=8,<10", "ruff>=0.9", "numpy>=1.26"]

[project.entry-points."vllm.general_plugins"]
cacheslide = "cacheslide_vllm.plugin:register"

[project.entry-points."sglang.srt.plugins"]
cacheslide = "cacheslide_sglang.plugin:register"

[project.scripts]
cacheslide = "cacheslide_sglang.cli:main"
cacheslide-benchmark = "cacheslide_sglang.workflow:main"
cacheslide-vllm = "cacheslide_vllm.cli:main"
cacheslide-vllm-benchmark = "cacheslide_vllm.workflow:main"
cacheslide-offline = "cacheslide_core.commands:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cacheslide_vllm = ["compatibility.json"]
cacheslide_sglang = ["compatibility.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
