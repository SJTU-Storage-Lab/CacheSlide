name: CacheSlide CPU and pinned SGLang and vLLM contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check out the audited engine (source inspection only)
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: 98dff2a81d747d1dba01a47f939f48c3526d4206
          path: .upstream-vllm
      - name: Install CPU test environment
        run: python -m pip install -c constraints/cpu-tests.txt '.[test]'
      - name: Check out the audited SGLang source
        uses: actions/checkout@v4
        with:
          repository: sgl-project/sglang
          ref: 0bcd822377da7b5718e674eaf9c870d349424dd1
          path: .upstream-sglang
      - name: Numerical, lifecycle and native source contracts
        env:
          CACHESLIDE_VLLM_SOURCE: ${{ github.workspace }}/.upstream-vllm
          CACHESLIDE_SGLANG_SOURCE: ${{ github.workspace }}/.upstream-sglang
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check src tests benchmarks
      - name: One-command CPU workflow
        run: ./run_cacheslide_benchmark.sh --smoke --output ./results/ci-smoke
      - name: Explicit approximate non-prefix variant
        run: ./run_cacheslide_benchmark.sh --smoke --ccpe-position-policy mixed_bias_override --calibration-layer 1 --output ./results/ci-mixed-smoke
      - name: Keep workflow diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-smoke-results
          path: |
            results/ci-smoke/
            results/ci-mixed-smoke/
